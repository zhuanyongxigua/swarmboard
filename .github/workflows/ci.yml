name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Verify real Codex plugin loading
        run: npm exec --yes --package=@openai/codex@0.162.1 -- node scripts/verify-plugin-host.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: swarmboard-desktop-plugin
          path: dist/swarmboard-desktop-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            playwright-report/
